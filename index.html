cation-aware dating web and mobile app for the Austrian market.",s:"A client needed a dating platform for Austria with location-based discovery, including a mobile app.",t:"Plan and lead delivery of the web and mobile app, including a localized-map feature for area-based match discovery.",a:"Owned project planning end-to-end and led the delivery team through build and release, including the map-based local-area discovery feature.",r:"Shipped a **live dating platform** (web + mobile) with map-based discovery for the Austrian market."},{name:"Liaison Marsark",image:"/liaison.jpg",meta:"Data extraction",tag:"Program led",oneliner:"A data extraction solution for parsing logistics invoices arriving in inconsistent formats.",s:"A logistics client needed to extract structured data from invoices that arrived in many different, inconsistent formats.",t:"Deliver a solution capable of extracting and standardizing data across varied invoice formats.",a:"Directed delivery of the extraction project, coordinating closely with engineering to handle format variability and edge cases.",r:"Delivered an **automated data-extraction capability** that reduced manual processing of multi-format logistics invoices."},{name:"MRC",meta:"Exabyting / MFS",image:"/mfs-mrc.jpg",tag:"Program led",oneliner:"A multi-app integration feature letting mobile operators publish custom deals directly to MFS customers.",s:"A leading MFS provider needed a way for multiple partner applications to integrate and let mobile operators upload custom deals for customers.",t:"Deliver a feature enabling multi-app integration for mobile-operator deal publishing.",a:"Managed delivery of the integration feature connecting multiple applications into the MFS ecosystem.",r:"Delivered a **production integration** enabling mobile operators to publish custom deals directly to MFS customers."},{name:"Live Provider App",image:"/live-provider.jpg",meta:"Augmedix",tag:"Program led",oneliner:"An app letting doctors live-stream and
